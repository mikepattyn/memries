services:
  arangodb:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
    volumes:
      - arango_data:/var/lib/arangodb3
      - arango_apps:/var/lib/arangodb3-apps
    ports:
      - "127.0.0.1:8529:8529"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8529/_admin/server/availability >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./deploy/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      MEMRIES_ADDR: ":8080"
      MEMRIES_ARANGO_URL: http://arangodb:8529
      MEMRIES_ARANGO_DB: memries
      MEMRIES_ARANGO_USER: root
      MEMRIES_ARANGO_PASSWORD: ${ARANGO_PASSWORD}
      MEMRIES_STORAGE_BACKEND: local
      MEMRIES_LOCAL_ROOT: /data/photos
      MEMRIES_CACHE_ROOT: /data/cache
      MEMRIES_OIDC_ISSUER: http://localhost:5556
      MEMRIES_OIDC_CLIENT_ID: memries
      MEMRIES_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      MEMRIES_OIDC_REDIRECT_URL: http://localhost/oauth/callback
      MEMRIES_SESSION_KEY: ${SESSION_KEY}
      MEMRIES_PUBLIC_URL: http://localhost
    volumes:
      - ./data/photos:/data/photos
      - ./data/cache:/data/cache
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      arangodb:
        condition: service_healthy
      dex:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      VITE_API_BASE: http://localhost
    ports:
      - "127.0.0.1:5173:80"

  caddy:
    image: caddy:2.8-alpine
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  arango_data:
  arango_apps:
  caddy_data:
  caddy_config:
